<!DOCTYPE html>
<html>
<head>
  <title>Form Filler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Form Filler</h1>
    <div id="loading">Scanning for forms and buttons...</div>
    <div id="no-forms" style="display: none;">No forms found on this page.</div>
    <div id="forms-container" style="display: none;"></div>
    <div class="buttons">
      <button id="apply-btn" disabled>Apply Values</button>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="buttons-container" style="display: none;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
